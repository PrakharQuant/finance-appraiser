<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinanceAppraiser - Financial Appraisal & Numerical Techniques</title>
    <meta name="description" content="Interactive learning tool for financial appraisal methods: NPV, IRR, BCR, Payback Period, ARR, Break-Even Analysis, Sensitivity Analysis, and Risk Measures." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💹</text></svg>" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }
      html.dark, html.dark body {
        background-color: #111827;
        color: #ffffff;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #f9fafb;
        color: #111827;
      }
    </style>
    <script>
      // Prevent flash of wrong theme
      (function() {
        const stored = localStorage.getItem('darkMode');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'true' || (stored === null && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
